services:
  db:
    image: postgres:16-alpine
    container_name: team-d-postgres
    environment:
      POSTGRES_USER: teamd
      POSTGRES_PASSWORD: teamd
      POSTGRES_DB: teamd_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamd -d teamd_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
